name: Growth Engine CI

on:
  push:
    branches:
      - main
      - development/chatgpt-mvp
  pull_request:
    branches:
      - main
      - development/chatgpt-mvp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Guard against committed environment and Firebase credential files
        shell: bash
        run: |
          set -euo pipefail
          matches="$(git ls-files | grep -E '(^|/)(\.env(\..*)?|service-account[^/]*\.json|firebase-service-account[^/]*\.json|.*-firebase-adminsdk-.*\.json|id_rsa|id_ed25519|[^/]*\.(pem|key|p12|pfx))$' | grep -vE '(^|/)\.env\.example$' || true)"
          if [[ -n "$matches" ]]; then
            echo "Refusing CI because sensitive environment or Firebase credential files are tracked:"
            echo "$matches"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependency advisories
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Validate emulator smoke script syntax
        run: node --check scripts/emulator-smoke-test.mjs
      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Firebase emulator integration smoke tests
        run: npm run test:emulators
        timeout-minutes: 15

  functions:
    name: Firebase Functions tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit dependency advisories
        run: npm audit --audit-level=high
      - name: Authorization unit tests
        run: npm test
      - name: Compile Functions
        run: npm run build
